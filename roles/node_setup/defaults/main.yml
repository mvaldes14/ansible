---
# defaults file for setup

# Username for SSH access configuration
username: mvaldes
username_home: "/home/{{ username }}"
user_login_shell: /usr/bin/zsh

# Shell setup
install_oh_my_zsh: true
oh_my_zsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
oh_my_zsh_dir: "{{ username_home }}/.oh-my-zsh"
oh_my_zsh_custom_dir: "{{ oh_my_zsh_dir }}/custom"
oh_my_zsh_plugins:
  - git
  - fzf
  - fzf-tab
  - zoxide
fzf_base_dir: /usr/share/doc/fzf/examples
fzf_tab_plugin_repo: https://github.com/Aloxaf/fzf-tab.git
fzf_tab_plugin_dir: "{{ oh_my_zsh_custom_dir }}/plugins/fzf-tab"
shell_extra_packages:
  - fzf
  - zoxide

# Enable/disable pihole service management
pihole_enabled: false

# Where k3s (and the Cilium chart, via cni.binPath) place CNI plugin binaries
k3s_cni_bin_dir: /var/lib/rancher/k3s/data/cni

# Where containerd looks for CNI plugins when k3s writes no cni config section
containerd_cni_bin_dir: /opt/cni/bin

# Plugins symlinked from k3s_cni_bin_dir into containerd_cni_bin_dir
cni_linked_plugins:
  - cilium-cni
  - loopback
