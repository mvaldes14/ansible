# SPDX-License-Identifier: MIT-0
---
# defaults file for setup

# Username for SSH access configuration
username: mvaldes
username_home: "/home/{{ username }}"
user_login_shell: /usr/bin/zsh

# Shell setup
install_oh_my_zsh: true
oh_my_zsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
oh_my_zsh_dir: "{{ username_home }}/.oh-my-zsh"
oh_my_zsh_custom_dir: "{{ oh_my_zsh_dir }}/custom"
node_setup_dotfiles_repo: https://github.com/mvaldes14/dotfiles.git
node_setup_dotfiles_dir: "{{ username_home }}/git/dotfiles"
node_setup_dotfiles_version: main
# Preserve existing working checkouts; updates are an explicit provisioning choice.
node_setup_dotfiles_update: false
node_setup_zsh_plugins:
  - name: fzf-tab
    repo: https://github.com/Aloxaf/fzf-tab.git
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
install_starship: true
starship_version: v1.23.0
starship_arch_map:
  x86_64: x86_64-unknown-linux-gnu
  aarch64: aarch64-unknown-linux-gnu
  arm64: aarch64-unknown-linux-gnu
# dotfiles initializes Atuin; use upstream builds rather than distro availability.
node_setup_atuin_version: "18.8.0"
node_setup_atuin_arch_map:
  x86_64: x86_64-unknown-linux-musl
  aarch64: aarch64-unknown-linux-musl
  arm64: aarch64-unknown-linux-musl
node_setup_atuin_archive: "atuin-{{ node_setup_atuin_arch_map[ansible_architecture] }}"
node_setup_atuin_url: "https://github.com/atuinsh/atuin/releases/download/v{{ node_setup_atuin_version }}/{{ node_setup_atuin_archive }}.tar.gz"
shell_extra_packages:
  - fzf
  - zoxide

# Enable/disable pihole service management
pihole_enabled: false

# Tailscale setup
node_setup_install_tailscale: true
node_setup_tailscale_channel: stable
node_setup_tailscale_package: tailscale
node_setup_tailscale_apt_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
node_setup_tailscale_apt_source: /etc/apt/sources.list.d/tailscale.list
node_setup_tailscale_apt_base_url: https://pkgs.tailscale.com
# Optional; set from an external secret source to auto-join new machines.
node_setup_tailscale_auth_key: ""
node_setup_tailscale_up_args: []
