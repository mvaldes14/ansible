- name: Verify
  hosts: all
  gather_facts: true
  vars:
    username: "mvaldes"
  tasks:
    # =========================================================================
    # SSH Access Tests (access.yml)
    # =========================================================================
    - name: Verify SSH Access
      tags:
        - ssh
        - access
      block:
        - name: Check SSH Package Installed
          ansible.builtin.package:
            name: openssh-server
            state: present
          check_mode: true
          register: ssh_package

        - name: Assert SSH Package Installed
          ansible.builtin.assert:
            that:
              - ssh_package is not changed
            fail_msg: "openssh-server package is not installed"
            success_msg: "openssh-server package is installed"

        - name: Check SSHD Config Exists
          ansible.builtin.stat:
            path: /etc/ssh/sshd_config
          register: sshd_config

        - name: Assert SSHD Config Exists
          ansible.builtin.assert:
            that:
              - sshd_config.stat.exists
              - sshd_config.stat.mode == "0644"
            fail_msg: "SSHD config file does not exist or has wrong permissions"
            success_msg: "SSHD config exists with correct permissions"

        - name: Read SSHD Config Content
          ansible.builtin.slurp:
            src: /etc/ssh/sshd_config
          register: sshd_config_content

        - name: Assert SSHD Config Contains Security Settings
          ansible.builtin.assert:
            that:
              - "'PermitRootLogin no' in sshd_config_content.content | b64decode"
              - "'PasswordAuthentication no' in sshd_config_content.content | b64decode"
              - "'PubkeyAuthentication yes' in sshd_config_content.content | b64decode"
              - "'PermitEmptyPasswords no' in sshd_config_content.content | b64decode"
              - "'X11Forwarding no' in sshd_config_content.content | b64decode"
            fail_msg: "SSHD config missing required security settings"
            success_msg: "SSHD config contains all required security settings"

        - name: Read Login Shell
          ansible.builtin.getent:
            database: passwd
            key: "{{ username }}"

        - name: Check Login Shell Binary Exists
          ansible.builtin.stat:
            path: "{{ getent_passwd[username][5] }}"
          register: login_shell_bin

        - name: Assert Login Shell Is Bash And Present
          ansible.builtin.assert:
            that:
              - getent_passwd[username][5] == "/usr/bin/bash"
              - login_shell_bin.stat.exists
            fail_msg: "Login shell for {{ username }} is not /usr/bin/bash or the binary is missing - sshd will reject the account"
            success_msg: "Login shell is /usr/bin/bash and the binary exists"

        - name: Check Sudoers File Exists
          ansible.builtin.stat:
            path: /etc/sudoers.d/sudoers-nopasswd
          register: sudoers_file

        - name: Assert Sudoers File Exists
          ansible.builtin.assert:
            that:
              - sudoers_file.stat.exists
            fail_msg: "Sudoers file does not exist"
            success_msg: "Sudoers file exists"

        - name: Read Sudoers File Content
          ansible.builtin.slurp:
            src: /etc/sudoers.d/sudoers-nopasswd
          register: sudoers_content

        - name: Assert Sudoers Grants Passwordless Sudo
          ansible.builtin.assert:
            that:
              - "username + ' ALL=NOPASSWD: ALL' in sudoers_content.content | b64decode"
            fail_msg: "Sudoers file does not grant passwordless sudo to {{ username }}"
            success_msg: "Sudoers file grants passwordless sudo to {{ username }}"

        - name: Check SSH Service Is Running
          ansible.builtin.systemd:
            name: ssh
          register: ssh_service

        - name: Assert SSH Service Is Running
          ansible.builtin.assert:
            that:
              - ssh_service.status.ActiveState == "active"
            fail_msg: "SSH service is not running"
            success_msg: "SSH service is running"

    # =========================================================================
    # MOTD Tests (motd.yml)
    # =========================================================================
    - name: Verify MOTD
      tags:
        - motd
      block:
        - name: Check Custom MOTD Script Exists
          ansible.builtin.stat:
            path: /etc/update-motd.d/00-homelab
          register: motd_script

        - name: Assert Custom MOTD Script Exists And Is Executable
          ansible.builtin.assert:
            that:
              - motd_script.stat.exists
              - motd_script.stat.executable
              - motd_script.stat.mode == "0755"
              - motd_script.stat.pw_name == "root"
              - motd_script.stat.gr_name == "root"
            fail_msg: "Custom MOTD script does not exist or has wrong permissions"
            success_msg: "Custom MOTD script exists with correct permissions"

        - name: Read MOTD Script Content
          ansible.builtin.slurp:
            src: /etc/update-motd.d/00-homelab
          register: motd_content

        - name: Assert MOTD Script Contains Expected Content
          ansible.builtin.assert:
            that:
              - "'#!/bin/bash' in motd_content.content | b64decode"
              - "'Dynamic MOTD script' in motd_content.content | b64decode"
              - "'System Information' in motd_content.content | b64decode"
              - "'Disk Usage' in motd_content.content | b64decode"
              - "'Memory Usage' in motd_content.content | b64decode"
            fail_msg: "MOTD script missing expected content"
            success_msg: "MOTD script contains all expected content"

        - name: Execute MOTD Script
          ansible.builtin.command: /etc/update-motd.d/00-homelab
          register: motd_output
          changed_when: false

        - name: Assert MOTD Script Executes Successfully
          ansible.builtin.assert:
            that:
              - motd_output.rc == 0
              - "'System Information' in motd_output.stdout"
            fail_msg: "MOTD script failed to execute"
            success_msg: "MOTD script executes successfully"

        - name: Assert MOTD Renders Cached Update Counts
          ansible.builtin.assert:
            that:
              - "'5 package(s) can be upgraded' in motd_output.stdout"
              - "'2 security update(s) available' in motd_output.stdout"
            fail_msg: "MOTD did not render the seeded cached update counts"
            success_msg: "MOTD renders cached update counts (non-zero path)"

        - name: Assert MOTD Script Does Not Shell Out To Apt
          ansible.builtin.assert:
            that:
              - "'apt-get' not in motd_content.content | b64decode"
              - "'apt ' not in motd_content.content | b64decode"
            fail_msg: "MOTD script still invokes apt on the login path"
            success_msg: "MOTD script no longer invokes apt on the login path"

        - name: Time MOTD Script Execution
          ansible.builtin.shell: |
            set -o pipefail
            start=$(date +%s%N)
            /etc/update-motd.d/00-homelab >/dev/null 2>&1
            end=$(date +%s%N)
            echo $(( (end - start) / 1000000 ))
          args:
            executable: /bin/bash
          register: motd_runtime_ms
          changed_when: false

        - name: Assert MOTD Script Runs Under The 50ms Budget
          ansible.builtin.assert:
            that:
              - motd_runtime_ms.stdout | int < 50
            fail_msg: "MOTD script took {{ motd_runtime_ms.stdout }}ms (budget: 50ms)"
            success_msg: "MOTD script ran in {{ motd_runtime_ms.stdout }}ms (budget: 50ms)"

        - name: Check Update Cache File Exists
          ansible.builtin.stat:
            path: /var/lib/node-motd/updates.cache
          register: update_cache

        - name: Read Update Cache Content
          ansible.builtin.slurp:
            src: /var/lib/node-motd/updates.cache
          register: update_cache_content

        - name: Assert Update Cache Exists And Is Well-Formed
          ansible.builtin.assert:
            that:
              - update_cache.stat.exists
              - "'updates=' in update_cache_content.content | b64decode"
              - "'security=' in update_cache_content.content | b64decode"
            fail_msg: "Update cache is missing or malformed"
            success_msg: "Update cache exists and is well-formed"

        - name: Check MOTD Refresh Script Is Executable
          ansible.builtin.stat:
            path: /usr/local/sbin/node-motd-refresh
          register: refresh_script

        - name: Assert MOTD Refresh Script Is Executable
          ansible.builtin.assert:
            that:
              - refresh_script.stat.exists
              - refresh_script.stat.executable
            fail_msg: "node-motd-refresh script is missing or not executable"
            success_msg: "node-motd-refresh script is present and executable"

        - name: Check MOTD Refresh Timer State
          ansible.builtin.systemd:
            name: node-motd-refresh.timer
          register: refresh_timer

        - name: Assert MOTD Refresh Timer Is Enabled And Active
          ansible.builtin.assert:
            that:
              - refresh_timer.status.UnitFileState == "enabled"
              - refresh_timer.status.ActiveState == "active"
            fail_msg: "node-motd-refresh.timer is not enabled/active"
            success_msg: "node-motd-refresh.timer is enabled and active"

        - name: Check Default MOTD Components Are Disabled
          ansible.builtin.stat:
            path: "/etc/update-motd.d/{{ item }}"
          loop:
            - 10-help-text
            - 50-motd-news
          register: disabled_motd_components

        - name: Assert Default MOTD Components Are Not Executable
          ansible.builtin.assert:
            that:
              - not item.stat.executable or not item.stat.exists
            fail_msg: "Default MOTD component {{ item.item }} should not be executable"
            success_msg: "Default MOTD component {{ item.item }} is properly disabled"
          loop: "{{ disabled_motd_components.results }}"
          when: item.stat.exists

        - name: Check PAM MOTD Configuration
          ansible.builtin.slurp:
            src: /etc/pam.d/sshd
          register: pam_sshd_content

        - name: Assert PAM MOTD Is Configured
          ansible.builtin.assert:
            that:
              - "'pam_motd.so' in pam_sshd_content.content | b64decode"
            fail_msg: "PAM MOTD is not configured in sshd"
            success_msg: "PAM MOTD is properly configured"

        - name: Check PrintMotd Setting In SSHD
          ansible.builtin.slurp:
            src: /etc/ssh/sshd_config
          register: sshd_motd_config

        - name: Assert PrintMotd Is Set
          ansible.builtin.assert:
            that:
              - "'PrintMotd' in sshd_motd_config.content | b64decode"
            fail_msg: "PrintMotd not configured in sshd_config"
            success_msg: "PrintMotd is configured in sshd_config"

    # =========================================================================
    # CNI Plugin Path Tests (cni.yml)
    # =========================================================================
    - name: Verify CNI Plugin Paths
      tags:
        - cni
      block:
        - name: Check CNI Plugin Symlinks
          ansible.builtin.stat:
            path: "/opt/cni/bin/{{ item }}"
            follow: false
          loop:
            - cilium-cni
            - loopback
          register: cni_links

        - name: Assert CNI Plugins Are Linked To The k3s Data Directory
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.islnk
              - item.stat.lnk_target == "/var/lib/rancher/k3s/data/cni/" ~ item.item
            fail_msg: "/opt/cni/bin/{{ item.item }} is not a symlink into the k3s CNI directory - containerd will fail with 'failed to find plugin'"
            success_msg: "/opt/cni/bin/{{ item.item }} links to the k3s CNI directory"
          loop: "{{ cni_links.results }}"

        - name: Check CNI Plugin Symlinks Resolve
          ansible.builtin.stat:
            path: "/opt/cni/bin/{{ item }}"
            follow: true
          loop:
            - cilium-cni
            - loopback
          register: cni_targets

        - name: Assert CNI Plugin Symlinks Resolve To Executables
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.executable
            fail_msg: "/opt/cni/bin/{{ item.item }} is a dangling symlink"
            success_msg: "/opt/cni/bin/{{ item.item }} resolves to an executable"
          loop: "{{ cni_targets.results }}"

    # =========================================================================
    # Idempotency Test
    # =========================================================================
    - name: Verify Idempotency Indicators
      tags:
        - idempotency
      block:
        - name: Verify All Config Files Have Proper Timestamps
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /etc/ssh/sshd_config
            - /etc/update-motd.d/00-homelab
          register: config_files_stat

        - name: Assert All Config Files Exist
          ansible.builtin.assert:
            that:
              - item.stat.exists
            fail_msg: "Config file {{ item.item }} does not exist"
            success_msg: "Config file {{ item.item }} exists"
          loop: "{{ config_files_stat.results }}"
