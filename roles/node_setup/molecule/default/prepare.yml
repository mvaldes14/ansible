- name: Prepare
  hosts: all
  gather_facts: false
  become: true
  tasks:
    # sshd refuses to run "-t" (used by the role's validate:) without its
    # privilege separation directory. On a real node systemd creates it from
    # ssh.service's RuntimeDirectory=sshd, but this container boots without
    # multi-user.target.wants and mounts /run as tmpfs, so nothing ever does.
    - name: Create sshd privilege separation directory
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        mode: "0755"
        owner: root
        group: root

    # Seed a non-zero update cache before converge so the MOTD's "N packages /
    # N security" render path is exercised without needing a node that actually
    # has pending updates. The role's first-run refresh uses "creates:", so it
    # leaves this seeded value in place.
    - name: Create MOTD update-cache directory
      ansible.builtin.file:
        path: /var/lib/node-motd
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Seed MOTD update cache with pending updates
      ansible.builtin.copy:
        dest: /var/lib/node-motd/updates.cache
        mode: "0644"
        owner: root
        group: root
        content: |
          updates=5
          security=2
          generated=2026-01-01T00:00:00Z

    - name: Create Local Dotfiles Source Directory
      ansible.builtin.file:
        path: /tmp/git-src/dotfiles/.config/zsh
        state: directory
        mode: "0755"

    - name: Initialize Local Dotfiles Repository
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          git init -b main .
          git config user.email molecule@example.com
          git config user.name Molecule
          printf 'export ZDOTDIR="$HOME/.config/zsh"\n' > .zshenv
          printf 'export DOTFILES_STARTUP_LOADED=yes\n' > .config/zsh/.zshrc
          git add .
          git commit -m 'initial dotfiles'
        chdir: /tmp/git-src/dotfiles
        creates: /tmp/git-src/dotfiles/.git
        executable: /bin/bash

    - name: Seed Existing Shell Configuration For Migration
      ansible.builtin.file:
        path: /home/mvaldes/.config/zsh
        state: directory
        owner: mvaldes
        group: mvaldes
        mode: "0755"

    - name: Seed Existing Zshrc
      ansible.builtin.copy:
        dest: /home/mvaldes/.config/zsh/.zshrc
        content: "# original user configuration\n"
        owner: mvaldes
        group: mvaldes
        mode: "0644"

    - name: Create Local Oh My Zsh Source Directory
      ansible.builtin.file:
        path: /tmp/git-src/ohmyzsh/templates
        state: directory
        mode: "0755"

    - name: Create Local fzf-tab Source Directory
      ansible.builtin.file:
        path: /tmp/git-src/fzf-tab
        state: directory
        mode: "0755"

    - name: Initialize Local Oh My Zsh Repository
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          git init -b master .
          git config user.email molecule@example.com
          git config user.name Molecule
          printf '# test zshrc\nplugins=(git)\n' > templates/zshrc.zsh-template
          git add .
          git commit -m 'initial ohmyzsh'
        chdir: /tmp/git-src/ohmyzsh
        creates: /tmp/git-src/ohmyzsh/.git
        executable: /bin/bash

    - name: Initialize Local fzf-tab Repository
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          git init -b master .
          git config user.email molecule@example.com
          git config user.name Molecule
          printf '# test fzf-tab plugin\n' > fzf-tab.plugin.zsh
          git add .
          git commit -m 'initial fzf-tab'
        chdir: /tmp/git-src/fzf-tab
        creates: /tmp/git-src/fzf-tab/.git
        executable: /bin/bash
