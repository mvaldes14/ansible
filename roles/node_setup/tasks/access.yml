- name: Setup SSH Things
  become: true
  block:
    - name: Configure Passwordless Sudo
      community.general.sudoers:
        name: sudoers-nopasswd
        state: present
        user: "{{ username }}"
        commands: ALL
        nopassword: true
        validation: required
    # sshd refuses the account outright when its login shell is missing from the
    # node ("User x not allowed because shell y does not exist"), which surfaces
    # client-side as a generic "Permission denied (publickey)" and looks like a
    # bad cert. Pin the shell to one that is always present.
    - name: Set Login Shell
      ansible.builtin.user:
        name: "{{ username }}"
        shell: /usr/bin/bash
    - name: Install ssh package
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
    - name: SSH Config
      ansible.builtin.copy:
        src: "sshd_config"
        dest: "/etc/ssh/sshd_config"
        mode: "0644"
        owner: root
        group: root
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      notify: RestartSSH
    - name: Check Vault SSH Endpoint
      ansible.builtin.uri:
        url: https://vault.mvaldes.dev/v1/ssh/public_key
        method: GET
        return_content: false
        status_code:
          - 200
          - -1
      ignore_errors: true
      register: vault_ssh_check
    - name: Get Certificate
      ansible.builtin.get_url:
        url: https://vault.mvaldes.dev/v1/ssh/public_key
        dest: "/etc/ssh/vault-cert.pub"
        mode: "0644"
      when:
        - vault_ssh_check is success
        - vault_ssh_check.status == 200
