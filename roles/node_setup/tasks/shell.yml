---
- name: Setup User Shell
  become: true
  block:
    - name: Install Shell Packages
      ansible.builtin.apt:
        name: "{{ ['git', 'zsh'] + shell_extra_packages }}"
        state: present
        update_cache: true

    - name: Set Login Shell
      ansible.builtin.user:
        name: "{{ username }}"
        shell: "{{ user_login_shell }}"

    - name: Install Oh My Zsh
      become: true
      become_user: "{{ username }}"
      ansible.builtin.git:
        repo: "{{ oh_my_zsh_repo }}"
        dest: "{{ oh_my_zsh_dir }}"
        version: master
        update: true
        accept_hostkey: true
      when: install_oh_my_zsh

    - name: Install Default Zshrc
      ansible.builtin.copy:
        src: "{{ oh_my_zsh_dir }}/templates/zshrc.zsh-template"
        dest: "{{ username_home }}/.zshrc"
        remote_src: true
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
        force: false
      when: install_oh_my_zsh

    - name: Install fzf-tab Oh My Zsh Plugin
      become: true
      become_user: "{{ username }}"
      ansible.builtin.git:
        repo: "{{ fzf_tab_plugin_repo }}"
        dest: "{{ fzf_tab_plugin_dir }}"
        version: master
        update: true
        accept_hostkey: true
      when: install_oh_my_zsh

    - name: Configure Oh My Zsh Plugins
      ansible.builtin.lineinfile:
        path: "{{ username_home }}/.zshrc"
        regexp: '^\s*plugins='
        line: "plugins=({{ oh_my_zsh_plugins | join(' ') }})"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: install_oh_my_zsh

    - name: Configure fzf Base Directory
      ansible.builtin.blockinfile:
        path: "{{ username_home }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED FZF CONFIG"
        insertbefore: '^source .*oh-my-zsh\.sh'
        block: |
          export FZF_BASE={{ fzf_base_dir }}
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: install_oh_my_zsh
