---
- name: Setup User Shell
  become: true
  block:
    - name: Install Shell Packages
      ansible.builtin.apt:
        name: "{{ ['git', 'zsh'] + shell_extra_packages }}"
        state: present
        update_cache: true

    - name: Setup Atuin
      ansible.builtin.import_tasks: atuin.yml

    - name: Assert Starship Architecture Is Supported
      ansible.builtin.assert:
        that:
          - ansible_architecture in starship_arch_map
        fail_msg: "Unsupported starship architecture: {{ ansible_architecture }}"
      when: install_starship

    - name: Check Starship Version
      ansible.builtin.command: /usr/local/bin/starship --version
      register: starship_installed_version
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_starship

    - name: Install Starship Prompt
      ansible.builtin.unarchive:
        src: "https://github.com/starship/starship/releases/download/{{ starship_version }}/starship-{{ starship_arch_map[ansible_architecture] }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when:
        - install_starship
        - starship_installed_version.rc != 0 or (starship_version | regex_replace('^v', '')) not in starship_installed_version.stdout

    - name: Set Login Shell
      ansible.builtin.user:
        name: "{{ username }}"
        shell: "{{ user_login_shell }}"

    - name: Install Oh My Zsh
      become_user: "{{ username }}"
      ansible.builtin.git:
        repo: "{{ oh_my_zsh_repo }}"
        dest: "{{ oh_my_zsh_dir }}"
        version: master
        update: false
      when: install_oh_my_zsh

    - name: Install Oh My Zsh Custom Plugins
      become_user: "{{ username }}"
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ oh_my_zsh_custom_dir }}/plugins/{{ item.name }}"
        version: "{{ item.version | default('master') }}"
        update: false
      loop: "{{ node_setup_zsh_plugins }}"
      when: install_oh_my_zsh

    - name: Setup Dotfiles Shell Configuration
      ansible.builtin.import_tasks: dotfiles.yml
