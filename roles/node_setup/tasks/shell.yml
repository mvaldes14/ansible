---
- name: Setup User Shell
  become: true
  block:
    - name: Install Shell Packages
      ansible.builtin.apt:
        name: "{{ ['git', 'zsh'] + shell_extra_packages }}"
        state: present
        update_cache: true

    - name: Set Login Shell
      ansible.builtin.user:
        name: "{{ username }}"
        shell: "{{ user_login_shell }}"

    - name: Install Oh My Zsh
      become: true
      become_user: "{{ username }}"
      ansible.builtin.git:
        repo: "{{ oh_my_zsh_repo }}"
        dest: "{{ oh_my_zsh_dir }}"
        version: master
        update: true
        accept_hostkey: true
      when: install_oh_my_zsh

    - name: Create Zsh Config Directory
      ansible.builtin.file:
        path: "{{ zshrc_path | dirname }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"
      when: install_oh_my_zsh

    - name: Install Default Zshrc
      ansible.builtin.copy:
        src: "{{ oh_my_zsh_dir }}/templates/zshrc.zsh-template"
        dest: "{{ zshrc_path }}"
        remote_src: true
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
        force: false
      when: install_oh_my_zsh

    - name: Remove Legacy Home Zshrc
      ansible.builtin.file:
        path: "{{ username_home }}/.zshrc"
        state: absent
      when: install_oh_my_zsh

    - name: Install fzf-tab Oh My Zsh Plugin
      become: true
      become_user: "{{ username }}"
      ansible.builtin.git:
        repo: "{{ fzf_tab_plugin_repo }}"
        dest: "{{ fzf_tab_plugin_dir }}"
        version: master
        update: true
        accept_hostkey: true
      when: install_oh_my_zsh

    - name: Configure Oh My Zsh Theme
      ansible.builtin.lineinfile:
        path: "{{ zshrc_path }}"
        regexp: '^\s*ZSH_THEME='
        line: "ZSH_THEME=\"{{ oh_my_zsh_theme }}\""
        insertbefore: '^source .*oh-my-zsh\.sh'
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: install_oh_my_zsh

    - name: Configure Oh My Zsh Plugins
      ansible.builtin.lineinfile:
        path: "{{ zshrc_path }}"
        regexp: '^\s*plugins='
        line: "plugins=({{ oh_my_zsh_plugins | join(' ') }})"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: install_oh_my_zsh

    - name: Configure Shell Path
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        marker: "# {mark} ANSIBLE MANAGED PATH CONFIG"
        insertbefore: '^source .*oh-my-zsh\.sh'
        block: |
          typeset -U path PATH
          for _pi_node_bin in "$HOME"/.local/share/pi-node/node-*-linux-x64/bin(N); do
            path=("$_pi_node_bin" $path)
            break
          done
          path=("$HOME/.local/bin" "$HOME/bin" "$HOME/scripts" $path)
          export PATH
          unset _pi_node_bin
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: install_oh_my_zsh

    - name: Configure fzf Base Directory
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        marker: "# {mark} ANSIBLE MANAGED FZF CONFIG"
        insertbefore: '^source .*oh-my-zsh\.sh'
        block: |
          export FZF_BASE={{ fzf_base_dir }}
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: install_oh_my_zsh
