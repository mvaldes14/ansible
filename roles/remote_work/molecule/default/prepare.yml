---
- name: Prepare
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Create Remote Work User
      ansible.builtin.user:
        name: mvaldes
        home: /home/mvaldes
        create_home: true
        shell: /bin/bash

    - name: Create Local Git Source Directories
      ansible.builtin.file:
        path: "/tmp/git-src/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - dotfiles
        - ansible
        - extra
        - wiki

    - name: Initialize Local Git Source Repositories
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          git init -b main .
          git config user.email molecule@example.com
          git config user.name Molecule
          printf '# {{ item }}\n' > README.md
          {% if item == 'dotfiles' %}
          mkdir -p ai
          cat > ai/bootstrap.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$HOME/.config/remote-work-bootstrap"
          printf bootstrapped > "$HOME/.config/remote-work-bootstrap/status"
          EOF
          chmod +x ai/bootstrap.sh
          {% endif %}
          git add .
          git commit -m 'initial {{ item }}'
        chdir: "/tmp/git-src/{{ item }}"
        creates: "/tmp/git-src/{{ item }}/.git"
        executable: /bin/bash
      loop:
        - dotfiles
        - ansible
        - extra
        - wiki

    - name: Install Fake Herdr Installer
      ansible.builtin.copy:
        dest: /tmp/herdr-install.sh
        mode: "0755"
        content: |
          #!/usr/bin/env sh
          set -eu
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/herdr" <<'EOF'
          #!/usr/bin/env sh
          echo herdr test
          EOF
          chmod +x "$HOME/.local/bin/herdr"

    - name: Install Fake Pi Installer
      ansible.builtin.copy:
        dest: /tmp/pi-install.sh
        mode: "0755"
        content: |
          #!/usr/bin/env sh
          set -eu
          mkdir -p "$HOME/.local/share/pi-node/test/bin"
          cat > "$HOME/.local/share/pi-node/test/bin/pi" <<'EOF'
          #!/usr/bin/env sh
          echo pi test
          EOF
          chmod +x "$HOME/.local/share/pi-node/test/bin/pi"

    - name: Install Fake Npm
      ansible.builtin.copy:
        dest: /usr/local/bin/fake-npm
        mode: "0755"
        content: |
          #!/usr/bin/env sh
          set -eu
          test "$1" = install
          test "$2" = -g
          test "$3" = obsidian-headless
          cat > /usr/local/bin/ob <<'EOF'
          #!/usr/bin/env sh
          echo obsidian-headless test
          EOF
          chmod +x /usr/local/bin/ob
